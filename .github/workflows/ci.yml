name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwayland-dev libwayland-bin pkg-config gcc
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
        env:
          SAARTHI_REQUIRE_NATIVE: "1"
      - run: bun run smoke
